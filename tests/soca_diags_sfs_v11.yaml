# Expected soca_diags records for the SFS_v11 ocean diag files in
# tests/data/sfs_v11, copied from
#   s3://noaa-reanalyses-pds/analyses/scout_runs/exper/SFS_v11/2023/02/2023020112/
#   gdas.20230201/12/analysis/ocean/diags/
# and mirrored in s3://noaa-reanalyses-pds/score_suite/test_data/sfs_v11/.
#
# The statistics and median times were computed independently of score-hv with
# xarray and pandas for the request in test_soca_diags_sfs_v11.py:
#   QC_threshold 0 (oman uses EffectiveQC1, the other groups EffectiveQC0),
#   depth bin edges [0, 20, 100, 500, 20000] m (lo <= depth < hi; files
#   without depth are not binned), StdDev with ddof=1, rms = sqrt(mean(x**2)),
#   mediantime = median MetaData/dateTime of the observations used, floored
#   to the second (whole-file median when no observation is used).
# filetime is the 2023-02-01 12Z cycle on every record (not listed).
# Statistics that are undefined (StdDev of one value, anything but count of
# no values) are not harvested and are omitted here.
#
# <file name>:
#   components: expected on every record of the file
#   variables:
#     <variable>:
#       longname, units: expected on every record of the variable
#       records: one entry per depth bin and data group

